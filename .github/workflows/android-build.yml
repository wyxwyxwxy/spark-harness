# Spark Harness 安卓 APK 自动构建
# 推送 android/** 变更或手动触发即产出 APK 工件（Actions 页下载）；
# 打 tag（如 v1.0.0）时会同时把 APK 附到 GitHub Release。

name: android-apk

on:
  push:
    branches: [main, master]
    paths: ['android/**', '.github/workflows/android-build.yml']
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v3

      - name: 编译 Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK 工件
        uses: actions/upload-artifact@v4
        with:
          name: spark-harness-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: 发布到 Release（仅 tag）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
